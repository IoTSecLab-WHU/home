<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物联网安全实验室 · 武汉大学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============ 配色：改这里就能换整站颜色 ============ */
:root{
  --ink:#10262E; --ink-2:#3C5560; --muted:#6B7F87;
  --paper:#F6F7F4; --card:#FFFFFF; --line:#DCE2DF;
  --accent:#1F6A7A; --accent-soft:#E2EEF0; --gold:#B8862E; --gold-soft:#F5EBD6;
  --hero:#10262E; --hero-ink:#EAF2F1;
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#E4ECEA; --ink-2:#B5C4C2; --muted:#8A9C9C;
  --paper:#0E1A1E; --card:#15252A; --line:#27393E;
  --accent:#6CB8C6; --accent-soft:#1B3238; --gold:#E0B25E; --gold-soft:#322A18;
  --hero:#0A1417; --hero-ink:#EAF2F1;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E4ECEA; --ink-2:#B5C4C2; --muted:#8A9C9C;
  --paper:#0E1A1E; --card:#15252A; --line:#27393E;
  --accent:#6CB8C6; --accent-soft:#1B3238; --gold:#E0B25E; --gold-soft:#322A18;
  --hero:#0A1417; --hero-ink:#EAF2F1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 顶部 */
header.top{background:var(--hero);color:var(--hero-ink)}
.brand{display:flex;align-items:center;gap:14px;padding-block:18px}
.logo{width:44px;height:44px;flex:none}
.brand-name{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand-en{font-size:12px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hero);border-top:1px solid rgba(255,255,255,.08)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--hero-ink);opacity:.72;padding:12px 14px;white-space:nowrap;font-size:14.5px;border-bottom:2px solid transparent}
nav.tabs a:hover{opacity:1;text-decoration:none}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--gold);font-weight:500}
nav.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{padding-block:36px 64px;min-height:60vh}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500}
.page-head h1{font-size:30px}
.page-head p{margin:0;color:var(--ink-2);max-width:65ch}
section+section{margin-top:44px}
h2.sec{font-size:21px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400}

/* 首页 hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:36px;align-items:start}
.hero h1{font-size:34px;font-weight:900;margin-bottom:14px}
.hero p{color:var(--ink-2);max-width:62ch;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);background:var(--card)}
.facts div{padding:16px 18px;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){border-right:1px solid var(--line)}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts b{display:block;font-family:var(--serif);font-size:28px;color:var(--accent);line-height:1.2}
.facts span{font-size:13px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px}

/* 新闻 */
.news-list{display:flex;flex-direction:column}
.news{display:grid;grid-template-columns:92px 1fr;gap:16px;padding-block:14px;border-bottom:1px dashed var(--line)}
.news:first-child{padding-top:0}
.news time{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.news h3{font-family:var(--sans);font-size:15.5px;font-weight:500;margin-bottom:4px}
.news p{margin:0;color:var(--ink-2);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;margin-right:6px;vertical-align:1px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.hire{background:var(--gold-soft);color:var(--gold)}
.tag.award{background:#F6E3E1;color:#A2413A}
:root[data-theme="dark"] .tag.award{background:#3A2220;color:#E79A92}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.award{background:#3A2220;color:#E79A92}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filters button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:4px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.notice{background:var(--gold-soft);border-left:3px solid var(--gold);padding:14px 16px}
.notice h3{font-size:16px;margin-bottom:4px}
.notice p{margin:0;font-size:14px;color:var(--ink-2)}

/* 研究方向 */
.rd-intro{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
.rd-intro p{margin:0;color:var(--ink-2);max-width:70ch}
.rd-jump{display:flex;flex-wrap:wrap;gap:8px}
.rd-jump button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.rd-jump button span{font-family:var(--mono);font-size:12px;color:var(--gold)}
.rd-jump button:hover{border-color:var(--accent)}
.rd{padding-top:40px;margin-top:40px;border-top:1px solid var(--line);scroll-margin-top:60px}
.rd-head{display:grid;grid-template-columns:260px 1fr;gap:32px}
.rd-head .code{font-family:var(--mono);font-size:13px;color:var(--gold)}
.rd-head h2{font-size:26px;margin:4px 0 14px}
.rd-body p{margin:0 0 14px;color:var(--ink-2);max-width:68ch}
.rd-q{margin:0;padding:14px 18px;background:var(--accent-soft);list-style:none;display:flex;flex-direction:column;gap:6px}
.rd-q b{font-size:13px;color:var(--accent);letter-spacing:.06em}
.rd-q li{font-size:14.5px;padding-left:18px;position:relative}
.rd-q li::before{content:"?";position:absolute;left:0;font-family:var(--serif);font-weight:700;color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12.5px;border:1px solid var(--line);padding:0 8px;border-radius:3px;color:var(--muted)}
.hl-label{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:26px 0 12px}
.hls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.hl{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line)}
.hl .fig{display:block;padding:0;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:zoom-in;aspect-ratio:16/11;width:100%;max-width:100%}
.hl .fig img{width:100%;height:100%;object-fit:contain;display:block}
.hl-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.hl h3{font-family:var(--sans);font-size:15.5px;font-weight:700;line-height:1.5}
.hl p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.65;flex:1}
.hl .cite{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.hl .cite i{font-style:italic;font-family:var(--sans);color:var(--accent)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,18,21,.82);display:flex;align-items:center;justify-content:center;padding:24px}
.lb figure{margin:0;max-width:min(960px,100%);background:var(--card);display:flex;flex-direction:column}
.lb img{background:#fff;max-height:72vh;width:100%;object-fit:contain}
.lb figcaption{padding:14px 18px;font-size:14px;color:var(--ink-2)}
.lb figcaption b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);border:0;padding:6px 14px;cursor:pointer}

/* 团队 */
.pi{display:grid;grid-template-columns:150px 1fr;gap:26px;background:var(--card);border:1px solid var(--line);padding:24px}
.avatar{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--serif);font-weight:700;font-size:22px;border-radius:50%}
.pi .avatar{border-radius:4px;font-size:44px}
.avatar.photo{overflow:hidden;background:var(--line)}
.avatar.photo img{width:100%;height:100%;object-fit:cover;display:block}
.nm a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .15s,color .15s}
.nm a:hover{color:var(--accent);border-bottom-color:var(--accent);text-decoration:none}
.nm a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nm .ext{font-size:.72em;margin-left:3px;color:var(--accent);vertical-align:.15em}
.pi h3{font-size:22px}
.pi .role{color:var(--gold);font-size:14px;margin-bottom:8px}
.pi p{margin:0 0 8px;color:var(--ink-2);font-size:14.5px}
.pi ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.person{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:14px;background:var(--card);border:1px solid var(--line)}
.person b{display:block;font-size:15px}
.person .t{font-size:13px;color:var(--gold)}
.person .r{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
.staff{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.staff-card{display:grid;grid-template-columns:64px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);padding:20px}
.staff-card h3{font-size:18px}
.staff-card .t{font-size:13.5px;color:var(--gold);margin-bottom:8px}
.staff-card .r{font-size:14px;color:var(--ink);margin-bottom:8px;line-height:1.6}
.staff-card .r b{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.staff-card p{margin:0 0 8px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.links{font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;color:var(--ink-2)}
.links .dot{color:var(--muted)}
.note{display:inline-block;font-size:13px;color:var(--gold);background:var(--gold-soft);padding:2px 10px;margin:0 0 12px}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:22px}
.pager button{font:inherit;font-size:14px;min-width:36px;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.pager button:hover:not(:disabled){border-color:var(--accent)}
.pager button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.pager button:disabled{opacity:.4;cursor:default}
.pager .gap{color:var(--muted);padding:0 4px}
.pager .info{margin-left:auto;font-size:13px;color:var(--muted)}
.filters button small{font-size:11.5px;opacity:.7;margin-left:2px}
.tag.sample{background:transparent;border:1px dashed var(--muted);color:var(--muted);margin:0 0 0 8px;font-weight:400}
#listTop{scroll-margin-top:64px}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);padding:16px 18px;margin:0}
.group-label{font-size:13px;color:var(--muted);margin:18px 0 10px;letter-spacing:.06em}

/* 表格 */
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px;background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:12px;padding:1px 8px;border-radius:3px;white-space:nowrap}
.status.on{background:var(--accent-soft);color:var(--accent)}
.status.done{background:var(--line);color:var(--muted)}

/* 论文 */
.pubs{counter-reset:p;list-style:none;margin:0;padding:0}
.pubs li{display:grid;grid-template-columns:40px 1fr;gap:10px;padding-block:12px;border-bottom:1px dashed var(--line);font-size:14.5px}
.pubs li::before{counter-increment:p;content:"[" counter(p) "]";font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.pubs .me{font-weight:700}
.pubs i{color:var(--accent);font-style:italic}
.pubs .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.plain{list-style:none;margin:0;padding:0}
.plain li{padding-block:10px;border-bottom:1px dashed var(--line);font-size:14.5px}
.plain li .meta{display:block;font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* 人才培养 */
.dest{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);padding:20px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--accent-soft);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .n{font-family:var(--mono);text-align:right;color:var(--ink-2)}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:0}
.quote p{margin:0 0 6px;font-family:var(--serif);font-size:16px}
.quote footer{font-size:13px;color:var(--muted)}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}

/* 加入我们 / 联系 */
.jobs{display:grid;gap:18px}
.job{background:var(--card);border:1px solid var(--line);padding:22px}
.job h3{font-size:19px;margin-bottom:6px}
.job .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.job ul{margin:0 0 6px;padding-left:18px;color:var(--ink-2);font-size:14.5px}
.contact{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font-size:15px;background:var(--card);border:1px solid var(--line);padding:22px}
.contact dt{color:var(--muted)}
.contact dd{margin:0}
.copy{font:inherit;font-size:12.5px;margin-left:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);padding:0 8px;border-radius:3px;cursor:pointer}

footer.site{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}
footer.site .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

@media (max-width:820px){
  .hero,.home-grid,.two,.rd-head{grid-template-columns:1fr}
  .rd-head{gap:0}
  .rd-head h2{font-size:22px}
  .pi,.staff{grid-template-columns:1fr}
  .pi .avatar{width:110px}
  .hero h1{font-size:27px}
  .page-head h1{font-size:25px}
  .news{grid-template-columns:1fr;gap:2px}
  .bar{grid-template-columns:90px 1fr 36px}
}
@media (prefers-reduced-motion:no-preference){ main>*{animation:in .25s ease-out} @keyframes in{from{transform:translateY(4px)}to{transform:none}} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap brand">
    <svg class="logo" viewBox="0 0 44 44" aria-hidden="true"><rect x="1" y="1" width="42" height="42" fill="none" stroke="currentColor" stroke-opacity=".4"/><g fill="currentColor"><circle cx="12" cy="12" r="2.4"/><circle cx="22" cy="12" r="2.4"/><circle cx="32" cy="12" r="2.4"/><circle cx="12" cy="22" r="2.4"/><circle cx="32" cy="22" r="2.4"/><circle cx="12" cy="32" r="2.4"/><circle cx="22" cy="32" r="2.4"/><circle cx="32" cy="32" r="2.4"/></g><circle cx="22" cy="22" r="4" fill="#E0B25E"/></svg>
    <div>
      <div class="brand-name" id="labName"></div>
      <div class="brand-en" id="labEn"></div>
    </div>
  </div>
  <nav class="tabs" aria-label="主导航"><div class="wrap" id="nav"></div></nav>
</header>

<main class="wrap" id="app"></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="查看大图"><button class="x" id="lbClose">关闭 ✕</button><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure></div>

<footer class="site"><div class="wrap"><span id="foot"></span><span>本站内容由实验室成员共同维护</span></div></footer>

<script>
/* =====================================================================
   内容都在 data/ 文件夹的 JSON 文件里，由后台（Pages CMS）或直接在 GitHub 上编辑。
   这里的代码负责读取并显示，平时不需要改。
   ===================================================================== */
const FILES = ["lab","news","research","team","projects","output","training","join"];
let LAB = {};
async function load(){
  const parts = await Promise.all(FILES.map(f=>fetch("data/"+f+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
  LAB = Object.assign({}, ...parts);
  Object.assign(LAB, parts[0]);
  LAB.news.sort((a,b)=>b.date.localeCompare(a.date));
  LAB.papers.sort((a,b)=>b.year-a.year);
  LAB.alumni.sort((a,b)=>b.year-a.year);
  const g={}; for(const s of LAB.students){(g[s.group] ||= []).push(s)} LAB.studentGroups=g;
}

/* ============================ 以下为渲染代码 ============================ */
const TABS = [
  ["home","首页"],["news","新闻动态"],["research","研究方向"],["team","科研团队"],
  ["projects","科研项目"],["output","科研成果"],["training","人才培养"],["join","加入我们"],["contact","联系我们"]
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initial = n => n.slice(-2);
const avatar = p => p.photo
  ? `<div class="avatar photo"><img src="${esc(p.photo)}" alt="${esc(p.name)}的照片" loading="lazy"></div>`
  : `<div class="avatar" aria-hidden="true">${initial(p.name)}</div>`;
const nameLink = (p, tag="b") => p.homepage
  ? `<${tag} class="nm"><a href="${esc(p.homepage)}" target="_blank" rel="noopener" title="访问${esc(p.name)}的个人主页">${p.name}<span class="ext" aria-hidden="true">↗</span></a></${tag}>`
  : `<${tag} class="nm">${p.name}</${tag}>`;
const tagCls = t => t==="招聘"?"tag hire":t==="获奖"?"tag award":"tag";
const head = (en, zh, desc) => `<div class="page-head"><span class="eyebrow">${en}</span><h1>${zh}</h1>${desc?`<p>${desc}</p>`:""}</div>`;
const newsItem = n => `<article class="news"><time>${n.date}</time><div><h3><span class="${tagCls(n.type)}">${n.type}</span>${esc(n.title)}${n.sample?`<span class="tag sample">示例</span>`:""}</h3><p>${esc(n.body)}</p></div></article>`;
const links = p => [p.email?`<span class="mono">${p.email}</span>`:"", p.homepage?`<a href="${esc(p.homepage)}" target="_blank" rel="noopener">个人主页 ↗</a>`:""].filter(Boolean).join('<span class="dot">·</span>');
const staffCard = p => `<article class="staff-card">${avatar(p)}<div>${nameLink(p,"h3")}<div class="t">${p.title}</div>${p.research?`<div class="r"><b>研究方向</b>${p.research}</div>`:""}${p.bio?`<p>${p.bio}</p>`:""}<div class="links">${links(p)}</div></div></article>`;
const personCard = p => `<div class="person">${avatar(p)}<div>${nameLink(p)}<div class="t">${p.title}</div>${p.research?`<div class="r">${p.research}</div>`:""}</div></div>`;

let newsFilter = "全部", pubFilter = "全部", newsPage = 1, pubPage = 1;
const NEWS_PER = 10, PUB_PER = 10;
const pageSlice = (arr,page,per) => arr.slice((page-1)*per, page*per);
function pager(total, page, per, key){
  const n = Math.ceil(total/per); if(n<=1) return "";
  const nums = []; for(let i=1;i<=n;i++){ if(i===1||i===n||Math.abs(i-page)<=1) nums.push(i); else if(nums[nums.length-1]!=="…") nums.push("…"); }
  const btn = (label,to,dis,cur) => `<button data-pg="${key}" data-to="${to}" ${dis?"disabled":""} ${cur?'aria-current="page"':""}>${label}</button>`;
  return `<nav class="pager" aria-label="分页">${btn("‹ 上一页",page-1,page===1)}${nums.map(x=>x==="…"?`<span class="gap">…</span>`:btn(x,x,false,x===page)).join("")}${btn("下一页 ›",page+1,page===n)}<span class="info">共 ${total} 条 · 第 ${page}/${n} 页</span></nav>`;
}

const PAGES = {
  home(){
    const pinned = LAB.news.find(n=>n.pin);
    return `
    <div class="hero">
      <div><span class="eyebrow">About the Lab</span><h1>${LAB.name}</h1>${LAB.intro.map(p=>`<p>${p}</p>`).join("")}
        <p><a href="#research">了解研究方向 →</a></p></div>
      <div class="facts">${LAB.facts.map(f=>`<div><b>${f.value}</b><span>${f.label}</span></div>`).join("")}</div>
    </div>
    <section class="home-grid" style="margin-top:44px">
      <div><h2 class="sec">新闻动态 <small><a href="#news">全部新闻</a></small></h2>
        <div class="news-list">${LAB.news.slice(0,4).map(newsItem).join("")}</div></div>
      <div style="display:flex;flex-direction:column;gap:22px">
        ${pinned?`<div class="notice"><span class="eyebrow">置顶</span><h3>${pinned.title}</h3><p>${pinned.body}</p><p style="margin-top:6px"><a href="#join">查看岗位 →</a></p></div>`:""}
        <div><h2 class="sec">研究方向</h2><ul class="plain">${LAB.directions.map(d=>`<li><span class="mono" style="color:var(--gold);font-size:12px;margin-right:8px">${d.code}</span>${d.title}</li>`).join("")}</ul></div>
      </div>
    </section>`;
  },
  news(){
    const types = ["全部",...new Set(LAB.news.map(n=>n.type))];
    const list = LAB.news.filter(n=>newsFilter==="全部"||n.type===newsFilter);
    const count = t => t==="全部"?LAB.news.length:LAB.news.filter(n=>n.type===t).length;
    return head("News","新闻动态","招聘信息、获奖喜报、学术成果、通知与活动。") +
      `${LAB.newsNote?`<p class="note">${LAB.newsNote}</p>`:""}
       <div class="filters" data-f="news" id="listTop">${types.map(t=>`<button aria-pressed="${t===newsFilter}" data-v="${t}">${t} <small>${count(t)}</small></button>`).join("")}</div>
       <div class="news-list">${pageSlice(list,newsPage,NEWS_PER).map(newsItem).join("")}</div>
       ${pager(list.length,newsPage,NEWS_PER,"news")}`;
  },
  research(){
    const hl = (x,di,hi) => `<article class="hl">
        <button class="fig" data-lb="${di}-${hi}" aria-label="放大查看：${esc(x.title)}"><img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy"></button>
        <div class="hl-body"><h3>${esc(x.title)}</h3><p>${esc(x.caption)}</p>
        <div class="cite"><i>${esc(x.citation||"")}</i>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">论文链接 ↗</a>`:""}</div></div></article>`;
    return head("Research","研究方向") + `
    <div class="rd-intro"><p>${LAB.overview||""}</p>
      <div class="rd-jump">${LAB.directions.map((d,i)=>`<button data-jump="rd-${i}"><span>${d.code}</span>${d.title}</button>`).join("")}</div></div>
    ${LAB.directions.map((d,di)=>`<section class="rd" id="rd-${di}">
      <div class="rd-head">
        <div><span class="code">${d.code}</span><h2>${d.title}</h2><div class="kw">${(d.kw||[]).map(k=>`<span>${k}</span>`).join("")}</div></div>
        <div class="rd-body"><p>${d.desc}</p>
          ${d.questions&&d.questions.length?`<ul class="rd-q"><b>关键科学问题</b>${d.questions.map(q=>`<li>${q}</li>`).join("")}</ul>`:""}</div>
      </div>
      ${d.highlights&&d.highlights.length?`<div class="hl-label">代表性成果 · ${d.highlights.length} 项</div><div class="hls">${d.highlights.map((x,hi)=>hl(x,di,hi)).join("")}</div>`:""}
    </section>`).join("")}`;
  },
  team(){
    const p = LAB.pi;
    const groups = Object.entries(LAB.studentGroups||{});
    return head("People","科研团队",`团队现有专任教师 ${LAB.staff.length+1} 位，研究方向覆盖网络与系统安全、人工智能安全和分布式智能系统。`) + `
    <section><h2 class="sec">实验室负责人</h2>
      <div class="pi">${avatar(p)}
        <div>${nameLink(p,"h3")}<div class="role">${p.title}</div><p>${p.bio}</p>
        <ul>${p.honors.map(h=>`<li>${h}</li>`).join("")}</ul>
        <p class="links">${links(p)}</p></div></div></section>
    <section><h2 class="sec">教师 <small>${LAB.staff.length} 位</small></h2><div class="staff">${LAB.staff.map(staffCard).join("")}</div></section>
    ${LAB.postdocs.length?`<section><h2 class="sec">博士后 <small>${LAB.postdocs.length} 人</small></h2><div class="people">${LAB.postdocs.map(personCard).join("")}</div></section>`:""}
    <section><h2 class="sec">在读学生</h2>${LAB.studentsNote?`<p class="note">${LAB.studentsNote}</p>`:""}${groups.length?groups.map(([g,arr])=>`<div class="group-label">${g} · ${arr.length} 人</div><div class="people">${arr.map(s=>personCard({...s,title:s.grade})).join("")}</div>`).join(""):`<p class="empty">学生名单整理中，即将更新。</p>`}</section>`;
  },
  projects(){
    const on = LAB.projects.filter(p=>p.status==="在研").length;
    return head("Projects","科研项目",`以下为团队承担的代表性科研项目，其中在研 ${on} 项，来源包括国家重点研发计划、国家自然科学基金、欧盟 HORIZON 计划及湖北省科技计划。`) +
      `<div class="tbl"><table><thead><tr><th>项目名称</th><th>项目来源</th><th>负责人</th><th>起止年份</th><th>状态</th></tr></thead><tbody>
      ${LAB.projects.map(p=>`<tr><td>${p.name}</td><td>${p.source}</td><td>${p.pi||"—"}</td><td class="num">${p.period}</td><td><span class="status ${p.status==="在研"?"on":"done"}">${p.status}</span></td></tr>`).join("")}
      </tbody></table></div>`;
  },
  output(){
    const tags = ["全部",...new Set(LAB.papers.map(p=>p.tag))];
    const list = LAB.papers.filter(p=>pubFilter==="全部"||p.tag===pubFilter);
    const side = [
      LAB.patents.length?`<div><h2 class="sec">授权专利</h2><ul class="plain">${LAB.patents.map(p=>`<li>${p.title}<span class="meta">${p.no} · ${p.year}</span></li>`).join("")}</ul></div>`:"",
      LAB.books.length?`<div><h2 class="sec">著作</h2><ul class="plain">${LAB.books.map(b=>`<li>${b.title}<span class="meta">${b.info}</span></li>`).join("")}</ul></div>`:""
    ].filter(Boolean);
    return head("Achievements","科研成果","科技奖励与代表性论文。作者中加粗的是本实验室教师，* 表示通讯作者。") + `
    <section><h2 class="sec">奖励与荣誉</h2><ul class="plain">${LAB.awards.map(a=>`<li>${a.title}<span class="meta">${a.year?a.year+" · ":""}${a.who}</span></li>`).join("")}</ul></section>
    <section><h2 class="sec">代表性论文 <small>${LAB.papers.length} 篇 · 按方向筛选</small></h2>
      <div class="filters" data-f="pub" id="listTop">${tags.map(t=>`<button aria-pressed="${t===pubFilter}" data-v="${t}">${t}</button>`).join("")}</div>
      <ol class="pubs" start="${(pubPage-1)*PUB_PER+1}" style="counter-reset:p ${(pubPage-1)*PUB_PER}">${pageSlice(list,pubPage,PUB_PER).map(p=>`<li><div>${esc(p.authors).replace(/\*\*(.+?)\*\*/g,"<span class=\"me\">$1</span>")}. ${esc(p.title)}. <i>${p.journal}</i>, <span class="meta">${p.vol||p.year}</span></div></li>`).join("")}</ol>${pager(list.length,pubPage,PUB_PER,"pub")}</section>
    ${side.length?`<section class="two">${side.join("")}</section>`:""}`;
  },
  training(){
    return head("Education","人才培养",LAB.summary) + `
    <section class="two">
      <div><h2 class="sec">培养方式</h2><ul class="plain">${LAB.training.map(t=>`<li>${t}</li>`).join("")}</ul></div>
      <div><h2 class="sec">毕业生去向</h2>${LAB.alumniNote?`<p class="note">${LAB.alumniNote}</p>`:""}${LAB.destStats.length?`<div class="dest">${LAB.destStats.map(d=>`<div class="bar"><span>${d.label}</span><div class="track"><div class="fill" style="width:${d.percent}%"></div></div><span class="n">${d.percent}%</span></div>`).join("")}</div>`:`<p class="empty">毕业生去向信息整理中，即将更新。</p>`}</div>
    </section>
    ${LAB.alumni.length?`<section><h2 class="sec">近年毕业生</h2>${LAB.alumniNote?`<p class="note">${LAB.alumniNote}</p>`:""}
      <div class="tbl"><table><thead><tr><th>姓名</th><th>学位</th><th>毕业年份</th><th>去向</th></tr></thead><tbody>
      ${LAB.alumni.map(a=>`<tr><td>${a.name}</td><td>${a.degree}</td><td class="num">${a.year}</td><td>${a.dest}</td></tr>`).join("")}
      </tbody></table></div></section>`:""}
    ${LAB.alumniWords.length?`<section><h2 class="sec">校友寄语</h2><div class="quotes">${LAB.alumniWords.map(q=>`<blockquote class="quote"><p>${q.text}</p><footer>${q.who}</footer></blockquote>`).join("")}</div></section>`:""}`;
  },
  join(){
    return head("Join Us","加入我们","欢迎对物联网安全、人工智能安全和智能系统感兴趣的同学与青年学者加入。申请材料（简历、成绩单、代表性成果）请发送至下方邮箱，邮件标题注明“申请类别 + 姓名 + 学校”。") +
      `<div class="jobs">${LAB.jobs.map(j=>`<div class="job"><h3>${j.title}</h3><div class="meta">招收人数：${j.n} · 申请时间：${j.deadline}</div><ul>${j.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div>
      <p style="margin-top:18px">联系邮箱：<span class="mono">${LAB.contact.email}</span><button class="copy" data-copy="${LAB.contact.email}">复制</button>　也可以直接联系感兴趣方向的老师，邮箱见“科研团队”。</p>`;
  },
  contact(){
    const c = LAB.contact;
    const row = (k,v,mono,copy) => v?`<dt>${k}</dt><dd${mono?' class="mono"':""}>${copy?`<span class="mono">${v}</span><button class="copy" data-copy="${v}">复制</button>`:v}</dd>`:"";
    return head("Contact","联系我们") + `<dl class="contact">${row("地址",c.address)}${row("邮编",c.postcode,true)}${row("邮箱",c.email,false,true)}${row("电话",c.phone,true)}</dl>`;
  }
};

function render(){
  let id = (location.hash||"#home").slice(1);
  if(!PAGES[id]) id = "home";
  $("#nav").innerHTML = TABS.map(([k,v])=>`<a href="#${k}" ${k===id?'aria-current="page"':""}>${v}</a>`).join("");
  $("#app").innerHTML = PAGES[id]();
  document.title = LAB.name;
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#lb").hidden=true; });
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const b = e.target.closest(".filters button");
  if(b){ if(b.parentElement.dataset.f==="news"){ newsFilter=b.dataset.v; newsPage=1; } else { pubFilter=b.dataset.v; pubPage=1; } render(); return; }
  const pg = e.target.closest("[data-pg]");
  if(pg && !pg.disabled){ const to=+pg.dataset.to; if(pg.dataset.pg==="news") newsPage=to; else pubPage=to; render();
    const top=document.getElementById("listTop"); if(top) top.scrollIntoView({block:"start"}); return; }
  const j = e.target.closest("[data-jump]");
  if(j){ document.getElementById(j.dataset.jump).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  const f = e.target.closest("[data-lb]");
  if(f){ const [di,hi]=f.dataset.lb.split("-").map(Number); const x=LAB.directions[di].highlights[hi];
    $("#lbImg").src=x.image; $("#lbImg").alt=x.title; $("#lbCap").innerHTML=`<b>${esc(x.title)}</b>${esc(x.caption)}`; $("#lb").hidden=false; $("#lbClose").focus(); return; }
  if(e.target.closest("#lb") && !e.target.closest("figure img, figcaption")){ $("#lb").hidden=true; return; }
  const c = e.target.closest(".copy");
  if(c){ navigator.clipboard.writeText(c.dataset.copy).then(()=>{c.textContent="已复制"},()=>{const r=document.createRange();r.selectNodeContents(c.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(r)}); }
});
load().then(()=>{
  $("#labName").textContent = LAB.name;
  $("#labEn").textContent = LAB.en;
  $("#foot").textContent = `© ${new Date().getFullYear()} ${LAB.name} · ${LAB.org}`;
  render();
}).catch(err=>{
  $("#app").innerHTML = `<div class="notice"><h3>内容没有加载出来</h3><p>读取 data/${esc(err.message)}.json 失败。请检查这个文件的格式（常见原因是少了逗号或引号），或者用本地服务器预览，不要直接双击打开 index.html。</p></div>`;
});
</script>
</body>
